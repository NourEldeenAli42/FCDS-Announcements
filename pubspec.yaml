  rxdart: ^0.28.0
  shimmer: ^3.0.0
  shorebird_code_push: ^2.0.5
  supabase_flutter: ^2.15.0
  syncfusion_flutter_datepicker: ^33.2.13+1
  timelines_plus: ^2.0.0
  timezone: ^0.11.0
  url_launcher: ^6.3.2
