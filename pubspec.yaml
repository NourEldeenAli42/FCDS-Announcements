dev_dependencies:
  android_notification_icons: null
  build_runner: ^2.4.13
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  isar_community_generator:
    version: ^3.3.2
android_notification_icons:
  image_path: 'assets/logo.png'
